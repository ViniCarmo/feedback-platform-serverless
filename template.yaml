AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Feedback platform - serverless (FIAP Tech Challenge 4)

Parameters:
  SenderEmail:
    Type: String
    Description: E-mail remetente, verificado no SES
  RecipientEmails:
    Type: String
    Description: E-mails dos administradores, separados por virgula

Globals:
  Function:
    Runtime: java21
    MemorySize: 512
    Timeout: 15
    Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1

Resources:

  # ---------- Banco ----------
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: submittedDate
          AttributeType: S
        - AttributeName: submittedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-submitted-date
          KeySchema:
            - AttributeName: submittedDate
              KeyType: HASH
            - AttributeName: submittedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  # ---------- Evento de avaliação crítica ----------
  CriticalFeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  # ---------- API ----------
  FeedbackApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Throttle:
            BurstLimit: 20
            RateLimit: 10
          Quota:
            Limit: 5000
            Period: MONTH

  # ---------- Função: receive-feedback ----------
  ReceiveFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: receive-feedback
      CodeUri: function-receive-feedback/target/function.zip
      Environment:
        Variables:
          FEEDBACK_TABLE_NAME: !Ref FeedbackTable
          FEEDBACK_CRITICAL_TOPIC_ARN: !Ref CriticalFeedbackTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FeedbackTable.Arn
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CriticalFeedbackTopic.TopicName
      Events:
        PostFeedback:
          Type: Api
          Properties:
            RestApiId: !Ref FeedbackApi
            Path: /avaliacao
            Method: post

  ReceiveFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/receive-feedback
      RetentionInDays: 14

  # ---------- Fila de avaliações críticas ----------
  CriticalFeedbackDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CriticalFeedbackQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CriticalFeedbackDLQ.Arn
        maxReceiveCount: 3

  CriticalFeedbackQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CriticalFeedbackQueue
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CriticalFeedbackQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref CriticalFeedbackTopic

  CriticalFeedbackSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CriticalFeedbackTopic
      Protocol: sqs
      Endpoint: !GetAtt CriticalFeedbackQueue.Arn
      RawMessageDelivery: true

  # ---------- Função: notify-critical ----------
  NotifyCriticalFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: notify-critical-feedback
      CodeUri: function-notify-critical/target/function.zip
      Environment:
        Variables:
          NOTIFICATION_SENDER_EMAIL: !Ref SenderEmail
          NOTIFICATION_RECIPIENT_EMAILS: !Ref RecipientEmails
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        CriticalFeedbackMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt CriticalFeedbackQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  NotifyCriticalFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/notify-critical-feedback
      RetentionInDays: 14

  # ---------- Relatórios ----------
  WeeklyReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-reports
            Status: Enabled
            ExpirationInDays: 365

  # ---------- Função: weekly-report ----------
  GenerateWeeklyReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: generate-weekly-report
      CodeUri: function-weekly-report/target/function.zip
      Timeout: 60
      Environment:
        Variables:
          FEEDBACK_TABLE_NAME: !Ref FeedbackTable
          REPORT_BUCKET_NAME: !Ref WeeklyReportBucket
          NOTIFICATION_SENDER_EMAIL: !Ref SenderEmail
          NOTIFICATION_RECIPIENT_EMAILS: !Ref RecipientEmails
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${FeedbackTable.Arn}/index/by-submitted-date
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${WeeklyReportBucket.Arn}/weekly-reports/*
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        WeeklySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 8 ? * MON *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Description: Generates the weekly feedback report every Monday at 08:00 (Brasilia)

  GenerateWeeklyReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/generate-weekly-report
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Endpoint para enviar avaliações
    Value: !Sub https://${FeedbackApi}.execute-api.${AWS::Region}.amazonaws.com/prod/avaliacao
  FeedbackTableName:
    Value: !Ref FeedbackTable
  WeeklyReportBucketName:
    Value: !Ref WeeklyReportBucket